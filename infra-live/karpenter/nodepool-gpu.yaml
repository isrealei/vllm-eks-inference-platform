apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-inference
spec:
  template:
    metadata:
      labels:
        node-type: gpu-a10g
        nvidia.com/gpu: "true"
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["g5", "g6"]          # g5=A10G, g6=L4 — both support vLLM inference
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["xlarge", "2xlarge", "4xlarge", "8xlarge"]  # all single-GPU variants
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule            # only GPU-requesting pods land here
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu-a10g                  # separate node class (see below)
      expireAfter: 720h                 # 30 days — aligns with AMI patching cadence
  limits:
    cpu: 32                              # caps at 1 node (g5.2xlarge = 8 vCPU)
    memory: 128Gi
    nvidia.com/gpu: 4                  # max 1 GPU total
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 10m