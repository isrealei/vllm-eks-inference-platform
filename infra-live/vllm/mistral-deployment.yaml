apiVersion: apps/v1
kind: Deployment
metadata:
  name: mistral-7b
  namespace: default
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mistral-7b
  template:
    metadata:
      labels:
        app: mistral-7b
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.3
          args:
            - --model
            - mistralai/Mistral-7B-Instruct-v0.3
            - --tokenizer-mode
            - mistral
            - --dtype
            - auto
            - --quantization
            - fp8
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.85"
            - --served-model-name
            - mistral-7b
            - --enable-prefix-caching
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    while ! curl -s http://localhost:8000/health; do sleep 1; done
                    curl -s http://localhost:8000/v1/chat/completions \
                      -H "Content-Type: application/json" \
                      -d '{"model":"mistral-7b","messages":[{"role":"user","content":"warmup"}],"max_tokens":10}'
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    kill -USR1 1 2>/dev/null || true
                    sleep 60
          ports:
            - containerPort: 8000
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "24Gi"
            requests:
              nvidia.com/gpu: "1"
              cpu: "4"
              memory: "16Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
            - name: dshm
              mountPath: /dev/shm
      priorityClassName: gpu-inference-critical
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: mistral-7b
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: mistral-7b
      nodeSelector:
        karpenter.sh/nodepool: gpu-inference
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: hf-model2-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
