apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-llama3
  annotations:
    # ensure this deploys after the GPU node pool is ready
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
    prometheus.io/scrape: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-llama3
  template:
    metadata:
      labels:
        app: vllm-llama3
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.3   # pin a version, don't use latest
          args:
            - --model
            - hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4
            - --quantization
            - awq
            - --dtype
            - auto
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.85"          # leave 15% headroom
            - --served-model-name
            - llama3           # friendly name for the API
            - --distributed-executor-backend
            - "mp"
            - --enable-prefix-caching
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    while ! curl -s http://localhost:8000/health; do sleep 1; done
                    curl -s http://localhost:8000/v1/chat/completions \
                      -H "Content-Type: application/json" \
                      -d '{"model":"llama3","messages":[{"role":"user","content":"warmup"}],"max_tokens":10}'
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    kill -USR1 1 2>/dev/null || true
                    sleep 60
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "16Gi"
            requests:
              nvidia.com/gpu: "1"
              cpu: "4"
              memory: "12Gi"
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120  # wait for model load before liveness kicks in
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: hf-model-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi

      priorityClassName: gpu-inference-critical
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: vllm-llama3
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: vllm-llama3
      nodeSelector:
        karpenter.sh/nodepool: gpu-inference # ensure it lands on GPU nodes
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
